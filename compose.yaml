name: education-integration-poc

# Every value has a working default, so `docker compose up --build -d` needs no
# .env file. Copy .env.example to .env to override anything.

x-appevents-worker: &appevents-worker
  build: ./integrations
  image: education-integration-poc/appevents-worker:local
  restart: unless-stopped
  depends_on:
    technology-one-sm:
      condition: service_healthy
    # No dependency on edw: workers must start and keep running while it is down.
  stop_grace_period: 10s

x-appevents-env: &appevents-env
  SOURCE_BASE_URL: ${SOURCE_BASE_URL:-http://technology-one-sm:8000}
  TARGET_BASE_URL: ${TARGET_BASE_URL:-http://edw:8000}
  API_TOKEN: ${API_TOKEN:-dev-poc-token}
  SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS:-30}
  HTTP_TIMEOUT_SECONDS: ${HTTP_TIMEOUT_SECONDS:-5}
  HTTP_MAX_RETRIES: ${HTTP_MAX_RETRIES:-1}
  HTTP_RETRY_BACKOFF_SECONDS: ${HTTP_RETRY_BACKOFF_SECONDS:-1}
  SOURCE_STARTUP_WAIT_SECONDS: ${SOURCE_STARTUP_WAIT_SECONDS:-60}
  METRICS_PORT: "9100"
  PROMETHEUS_DISABLE_CREATED_SERIES: "true"

services:
  technology-one-sm-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SOURCE_DB_NAME:-technology_one_sm}
      POSTGRES_USER: ${SOURCE_DB_USER:-technology_one_sm}
      POSTGRES_PASSWORD: ${SOURCE_DB_PASSWORD:-source-dev-password}
    volumes:
      - technology-one-sm-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  edw-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${TARGET_DB_NAME:-edw}
      POSTGRES_USER: ${TARGET_DB_USER:-edw}
      POSTGRES_PASSWORD: ${TARGET_DB_PASSWORD:-target-dev-password}
    volumes:
      - edw-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  technology-one-sm:
    build: ./app-technology-one-sm
    image: education-integration-poc/technology-one-sm:local
    restart: unless-stopped
    depends_on:
      technology-one-sm-db:
        condition: service_healthy
    environment:
      APP_NAME: technology-one-sm
      DATABASE_URL: postgresql://${SOURCE_DB_USER:-technology_one_sm}:${SOURCE_DB_PASSWORD:-source-dev-password}@technology-one-sm-db:5432/${SOURCE_DB_NAME:-technology_one_sm}
      API_TOKEN: ${API_TOKEN:-dev-poc-token}
      PROMETHEUS_DISABLE_CREATED_SERIES: "true"
    ports:
      - "127.0.0.1:${SOURCE_HOST_PORT:-8001}:8000"

  edw:
    build: ./app-edw
    image: education-integration-poc/edw:local
    # unless-stopped: recovers from crashes, but `docker compose stop edw`
    # keeps it down until `docker compose start edw`.
    restart: unless-stopped
    depends_on:
      edw-db:
        condition: service_healthy
    environment:
      APP_NAME: edw
      DATABASE_URL: postgresql://${TARGET_DB_USER:-edw}:${TARGET_DB_PASSWORD:-target-dev-password}@edw-db:5432/${TARGET_DB_NAME:-edw}
      API_TOKEN: ${API_TOKEN:-dev-poc-token}
      PROMETHEUS_DISABLE_CREATED_SERIES: "true"
    ports:
      - "127.0.0.1:${TARGET_HOST_PORT:-8002}:8000"

  appevents-student:
    <<: *appevents-worker
    environment:
      <<: *appevents-env
      INTEGRATION: student
    ports:
      - "127.0.0.1:${APPEVENTS_STUDENT_METRICS_PORT:-9101}:9100"

  appevents-general:
    <<: *appevents-worker
    environment:
      <<: *appevents-env
      INTEGRATION: general
    ports:
      - "127.0.0.1:${APPEVENTS_GENERAL_METRICS_PORT:-9102}:9100"

  appevents-curriculum:
    <<: *appevents-worker
    environment:
      <<: *appevents-env
      INTEGRATION: curriculum
    ports:
      - "127.0.0.1:${APPEVENTS_CURRICULUM_METRICS_PORT:-9103}:9100"

  # ---------------------------------------------------------------------------
  # Optional monitoring, not part of the POC deliverable. Only started with:
  #   docker compose --profile observability up -d
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: [observability]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
    volumes:
      - ./observability/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_HOST_PORT:-9090}:9090"

  grafana:
    image: grafana/grafana:11.3.1
    profiles: [observability]
    restart: unless-stopped
    depends_on: [prometheus]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/integration-overview.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-3000}:3000"

volumes:
  technology-one-sm-db-data:
  edw-db-data:
  prometheus-data:
  grafana-data:
