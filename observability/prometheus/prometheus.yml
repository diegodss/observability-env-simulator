# Optional monitoring profile (docker compose --profile observability up -d).
# ci_name is the exact Jira Assets object Name (the CI) each target represents;
# display_name is a short label for dashboards.
global:
  scrape_interval: 10s
  scrape_timeout: 5s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: technology-one-sm
    static_configs:
      - targets: ["technology-one-sm:8000"]
        labels: {display_name: "Technology One (SM)", ci_name: "Technology One (SM)"}
  - job_name: edw
    static_configs:
      - targets: ["edw:8000"]
        labels: {display_name: "EDW", ci_name: "EDW"}
  - job_name: appevents-student
    static_configs:
      - targets: ["appevents-student:9100"]
        labels: {display_name: "AppEvents - Student", ci_name: "ETL - DXMULTI-0001 : AppEvents from SMS to EDW - Student"}
  - job_name: appevents-curriculum
    static_configs:
      - targets: ["appevents-curriculum:9100"]
        labels: {display_name: "AppEvents - Curriculum", ci_name: "ETL - DXMULTI-0001 : AppEvents from SMS to EDW - Curriculum"}
  - job_name: appevents-general
    static_configs:
      - targets: ["appevents-general:9100"]
        labels: {display_name: "AppEvents - General", ci_name: "ETL - DXMULTI-0001 : AppEvents from SMS to EDW"}
