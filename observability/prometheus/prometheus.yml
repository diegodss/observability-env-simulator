# Optional monitoring profile (docker compose --profile observability up -d).
# Job names equal the services' Monitoring Job keys in Jira Assets, and the
# display_name label carries the real system name for dashboards.
global:
  scrape_interval: 10s
  scrape_timeout: 5s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: sis
    static_configs:
      - targets: ["sis:8000"]
        labels: {display_name: "Technology One (SM)"}
  - job_name: lms
    static_configs:
      - targets: ["lms:8000"]
        labels: {display_name: "EDW"}
  - job_name: sync-students
    static_configs:
      - targets: ["sync-students:9100"]
        labels: {display_name: "AppEvents - Student"}
  - job_name: sync-courses
    static_configs:
      - targets: ["sync-courses:9100"]
        labels: {display_name: "AppEvents - Curriculum"}
  - job_name: sync-staff
    static_configs:
      - targets: ["sync-staff:9100"]
        labels: {display_name: "AppEvents (General)"}
